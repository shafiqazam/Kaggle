[project]
name = "kaggle-workspace"
version = "0.1.0"
description = "Kaggle competitions and ML course notebooks"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel==7.1.0",
    "jupyterlab==4.5.3",
    "kaggle==1.8.2",
    "matplotlib==3.10.7",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "xgboost==3.1.2",
]

[dependency-groups]
# Only needed for "AI Agents Intensive Course Google". Install with: uv sync --group agents
agents = [
    "duckduckgo-search==8.1.1",
    "google-adk==1.32.0",
    "google-genai==1.74.0",
    "langchain==1.2.17",
    "langchain-community==0.4.1",
    "langchain-ollama==1.1.0",
    "langgraph==1.1.10",
    "litellm==1.83.7",
    "python-dotenv==1.0.1",
]

[tool.uv]
package = false
